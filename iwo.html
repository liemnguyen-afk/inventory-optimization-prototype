<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Item Warehouse Optimization · Inventory Optimization prototype</title>
  <link rel="stylesheet" href="css/clarity-tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <div class="title-row">
      <h1 class="page-title">Item Warehouse Optimization</h1>
      <button class="btn-classic" data-stub>Switch to Classic</button>
    </div>
    <nav class="page-tabs">
      <a href="ohb.html">On-Hand Balances</a>
      <a href="#" data-stub>Item Supply and Demand Reports</a>
      <a href="iwo.html" class="selected">Item Warehouse Optimization</a>
    </nav>

    <div class="flash" id="flash" hidden><span></span><button aria-label="Dismiss"><img src="assets/banner-close.svg" alt=""></button></div>

    <section class="card">
      <div class="views-row">
        <button class="views-btn" data-stub><img src="assets/menu.svg" alt="">Views</button>
        <span class="views-title">All</span>
      </div>
      <div class="toolbar">
        <span class="spacer"></span>
        <label class="search"><img src="assets/search.svg" alt=""><input id="q" placeholder="Search"></label>
        <button class="icon-btn sm" data-stub aria-label="Filter"><img src="assets/filter.svg" alt=""></button>
        <button class="icon-btn kebab" data-stub aria-label="More"></button>
      </div>
      <div id="table"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script>
    initPage({ primary: 'Inventory', sub: 'On-Hand Balances' });
    aiFab();
    document.querySelector('.kebab').innerHTML = ICON.kebab;

    // Success banner after saving Setup Preferences.
    const flash = document.getElementById('flash');
    const banner = sessionStorage.getItem('invopt-banner');
    if (banner) {
      sessionStorage.removeItem('invopt-banner');
      flash.querySelector('span').textContent = banner;
      flash.hidden = false;
      setTimeout(() => {
        flash.classList.add('fading');
        flash.addEventListener('transitionend', () => { flash.hidden = true; }, { once: true });
      }, 5000);
    }
    flash.querySelector('button').addEventListener('click', () => { flash.hidden = true; });

    const highlight = new URLSearchParams(location.search).get('highlight');
    const q = document.getElementById('q');

    function render() {
      const items = Store.get().items.filter(i => !i.hideInOptimization);
      const term = q.value.trim().toLowerCase();
      const rows = items.filter(i => !term || [i.name, i.warehouse, i.type, i.supplier, i.requestor].join(' ').toLowerCase().includes(term));
      document.getElementById('table').innerHTML = `
        <div class="table-wrap"><table class="dt">
          <thead><tr>
            <th>Name</th><th>Warehouse</th><th>Replenishment Type</th><th class="num">Minimum Qty</th><th>UOM</th>
            <th class="num">Reorder / Maximum Qty</th><th>UOM</th><th>Supplier</th>
            <th><span class="ai-head"><img src="assets/ai-sparkle.svg" alt="">Segment</span></th><th>Requestor</th><th class="sticky">Actions</th>
          </tr></thead>
          <tbody>${rows.map(i => `<tr class="${String(i.id) === highlight ? 'row-new' : ''}">
            <td><a href="prefs.html?id=${i.id}">${esc(i.name)}</a></td>
            <td><a href="#" data-stub>${esc(i.warehouse)}</a></td>
            <td><span class="reco-trigger">${esc(i.type)}${i.reco
              ? `<button data-popover-trigger data-reco="${i.id}" aria-label="View recommendation"><img src="assets/ai-sparkle.svg" alt=""></button>` : ''}</span></td>
            <td class="num">${i.min}</td>
            <td>${i.uom}</td>
            <td class="num">${i.max}</td>
            <td>${i.uom2}</td>
            <td>${esc(i.supplier)}</td>
            <td><span class="seg-chip">${i.segment}</span></td>
            <td>${esc(i.requestor)}</td>
            <td class="sticky"><div class="actions">
              <a class="icon-btn ghost" href="prefs.html?id=${i.id}" title="Edit Setup Preferences"><img src="assets/icon-edit.svg" alt="Edit"></a>
            </div></td>
          </tr>`).join('')}</tbody>
        </table></div>
        ${pagerHtml()}`;
    }

    document.addEventListener('click', e => {
      const trig = e.target.closest('[data-reco]');
      if (!trig) return;
      const item = Store.item(trig.dataset.reco);
      showRecoPopover(trig, { ...item.reco, unit: item.uom }, { detailsHref: `prefs.html?id=${item.id}`, applied: item.recoAppliedOn });
    });
    q.addEventListener('input', render);
    render();
  </script>
</body>
</html>
